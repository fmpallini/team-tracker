name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Release assets are the standalone file:// build only — the PWA build
      # still gets produced and attested below (deploy-pages serves it to
      # GitHub Pages), it's just not zipped up as a separate downloadable
      # release asset alongside it.
      - name: Assemble release assets
        id: assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p staging
          cp dist/app.html "staging/team-tracker-${VERSION}.html"
          (cd staging && sha256sum * > checksums.txt)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # dist/pwa/** stays in the attested subject set even though it isn't a
      # release asset: it's what deploy-pages publishes to GitHub Pages, so
      # this is what proves *that* build is genuinely what this workflow run
      # produced.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            staging/team-tracker-${{ steps.assets.outputs.version }}.html
            dist/pwa/**

      # Prefer the human/AI-written entry in CHANGELOG.md (user-facing prose)
      # over GitHub's auto-generated PR-title list. Extracts the section
      # between this version's "## [x.y.z]" header and the next "## [" one.
      # Falls back to --generate-notes if the file or entry is missing, so a
      # forgotten changelog update never blocks a release.
      - name: Extract changelog section
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.assets.outputs.version }}"
          touch CHANGELOG.md
          awk -v target="## [${VERSION}]" '
            index($0, target) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { lines[++n] = $0 }
            END {
              start=1; while (start<=n && lines[start]=="") start++
              end=n; while (end>=start && lines[end]=="") end--
              for (i=start; i<=end; i++) print lines[i]
            }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.notes.outputs.found }}" = "true" ]; then
            gh release create "${{ github.ref_name }}" \
              staging/team-tracker-${{ steps.assets.outputs.version }}.html \
              staging/checksums.txt \
              --notes-file notes.md \
              --title "${{ github.ref_name }}"
          else
            echo "::warning::No CHANGELOG.md entry for ${{ steps.assets.outputs.version }} — falling back to auto-generated notes."
            gh release create "${{ github.ref_name }}" \
              staging/team-tracker-${{ steps.assets.outputs.version }}.html \
              staging/checksums.txt \
              --generate-notes \
              --title "${{ github.ref_name }}"
          fi

      # deploy-pages deploys this exact build (not a rebuild) so the live
      # Pages site is provably the same bytes just attested above, not a
      # separately-built copy that merely shares the same source.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwa-build
          path: dist/pwa

  # Publishes the same attested PWA build to GitHub Pages on every tagged
  # release — separate job so its own `pages`/`id-token` permissions and
  # `github-pages` environment stay scoped away from the release-asset job
  # above. Deploys the artifact build-and-release already built and attested,
  # rather than rebuilding, so there's an unbroken chain from "attested" to
  # "what's actually served."
  deploy-pages:
    name: Deploy PWA to GitHub Pages
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pwa-build
          path: dist/pwa
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pwa
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
