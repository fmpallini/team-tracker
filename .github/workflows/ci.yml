name: CI

on:
  push:
    branches:
      - dev
  # Into dev: Dependabot's bump PRs (dependabot.yml sets target-branch: dev) —
  # that's the only thing that opens a PR against dev, since all human work
  # commits to dev directly (CLAUDE.md: no feature branches). Into main: the
  # release PR, which picks up the heavier gates below.
  pull_request:
    branches:
      - dev
      - main

# Pushing twice in quick succession used to leave both runs going, each paying
# for a full build + Chromium. Supersede the in-flight run for a PR — a new
# commit makes the old verdict irrelevant — but never for a push to dev, so
# every commit that actually lands keeps its own recorded result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deny by default; each job opts into exactly what it needs. A job added later
# without its own `permissions:` block fails closed instead of inheriting
# whatever the repo default happens to be.
permissions: {}

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # e2e used to run only in the pre-push hook, on your machine, on every push
  # — the slowest gate there (full build + Chromium). Moved here so pushes are
  # fast and e2e enforcement no longer depends on the hook being installed or
  # not bypassed with --no-verify. Runs on every push to dev (catch early) and
  # on PRs into main (release gate); skipped for PRs into dev, i.e. Dependabot
  # bumps — those still get `check`, and the e2e run on the dev push that
  # merges them.
  #
  # Three jobs make that up: `e2e-plan` decides whether the suite has to run,
  # `e2e-shard` runs it in three parts in parallel, and `e2e` (the name the rest
  # of the repo knows) folds the parts into one verdict.

  # A release PR (dev -> main) is the same commit the dev push already tested.
  # Re-running e2e there proves nothing new when (a) that exact SHA already has
  # a green `E2E (Playwright)` and (b) main is an ancestor of it, so merging
  # changes no file and the merge ref's tree equals the tested tree. If either
  # fails (main gained a commit dev lacks, or the dev run is red), the suite
  # runs in full as before.
  #
  # The release PR is opened seconds after the push that put its head on dev,
  # so that push's E2E is always still running when this job starts. Checking
  # once and moving on never saw it green (no release PR from #154 to #159 ever
  # skipped), and every release paid for the suite twice, side by side. So when
  # main is an ancestor, wait for the dev push's CI run on this SHA to finish
  # first. Costs nothing in wall time on the happy path (the PR's verdict lands
  # when the push's does); when the push run is red, the full suite starts
  # after it, as it would have anyway. timeout-minutes covers that wait: the
  # push run's own E2E parts are capped at 20.
  e2e-plan:
    name: E2E plan
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      # The E2E parts run inside the Playwright image whose tag must match the
      # installed @playwright/test exactly (the image's browser build is tied
      # to it). Read from the lockfile, so a Dependabot bump moves the image
      # with it; only that one file is checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: playwright
        run: |
          set -euo pipefail
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright $version"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$EVENT" = pull_request ]; then
            behind=$(gh api "repos/$REPO/compare/$BASE...$SHA" --jq .behind_by)
            echo "main is $behind commit(s) ahead of the PR head"
            if [ "$behind" = 0 ]; then
              push_run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=1" --jq '.workflow_runs[0].id // empty')
              if [ -n "$push_run" ]; then
                echo "Waiting for the dev push CI run $push_run on $SHA to finish"
                # No --exit-status: a red push run only means the suite runs here.
                gh run watch "$push_run" --repo "$REPO" --interval 20 > /dev/null
              fi
              green=$(gh api -X GET "repos/$REPO/commits/$SHA/check-runs" -f check_name='E2E (Playwright)' -f per_page=100 --jq '[.check_runs[] | select(.conclusion == "success")] | length')
              echo "green E2E runs on $SHA: $green"
              if [ "$green" -gt 0 ]; then skip=true; fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "E2E skip: $skip"

  e2e-shard:
    name: E2E ${{ matrix.part }}
    needs: e2e-plan
    if: needs.e2e-plan.outputs.skip != 'true'
    # Inside the official Playwright image, which ships Chromium and every OS
    # library and font it needs. It replaced a Chromium cache plus
    # `playwright install-deps` on the bare runner: that apt download took
    # ~20 s or ~5.5 min with nothing in between (slow on 7 of 9 parts in a
    # side-by-side probe, even on ubuntu-24.04), and one slow part set the
    # whole run's time; release PRs also missed the cache outright, since a PR
    # can't read dev's cache. The image starts in ~25 s every time (probe:
    # slowest part 3.6-4.3 min against 8.0-9.5). Its tag follows
    # @playwright/test (see e2e-plan), which also pins the fonts the layout
    # specs measure against. --user 1001 is the runner's uid, so checkout and
    # the workspace stay writable; --ipc=host is Playwright's advice for
    # Chromium in Docker (the default 64 MB /dev/shm can crash it).
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.e2e-plan.outputs.playwright }}-noble
      options: --user 1001 --ipc=host
    timeout-minutes: 20
    strategy:
      # One red part must not hide the other part's result (or its trace artifact).
      fail-fast: false
      matrix:
        include:
          - part: leak
            args: --project=leak
          - part: main-1
            args: --project=chromium --shard=1/2
          - part: main-2
            args: --project=chromium --shard=2/2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The same suite, in three parts that together cover every spec (the two
      # Playwright projects in playwright.config.ts): leak.spec.ts is one serial
      # chain (~1.5 min) that a count-based shard cannot split, so it keeps a
      # runner of its own; the chromium project (~5 min on one runner, which made
      # it the floor of the whole run) is sharded in two beside it. With
      # fullyParallel each test is its own shard unit, so the halves come out
      # even. Each part keeps the runner's own 2 workers; more workers per runner
      # would only make the timing-sensitive specs (search/nav cost, large
      # paste) noisier.
      - run: npm run test:e2e -- ${{ matrix.args }}

      # playwright.config.ts records a trace on first retry; without this the
      # trace is written into the runner and thrown away, leaving a CI-only
      # failure with nothing to open locally.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results-${{ github.run_id }}-${{ matrix.part }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The one E2E verdict. Keeps the name the earlier single job had, which is
  # also what `e2e-plan` looks up on a release PR's head SHA.
  e2e:
    name: E2E (Playwright)
    needs: [e2e-plan, e2e-shard]
    if: always() && (github.event_name == 'push' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          PLAN: ${{ needs.e2e-plan.result }}
          SKIP: ${{ needs.e2e-plan.outputs.skip }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "plan=$PLAN skip=$SKIP shards=$SHARDS"
          [ "$PLAN" = success ] || { echo "::error::E2E plan did not succeed"; exit 1; }
          if [ "$SKIP" = true ]; then
            echo "Skipped: this exact commit already passed E2E and main adds nothing to it."
            exit 0
          fi
          [ "$SHARDS" = success ] || { echo "::error::an E2E part did not succeed"; exit 1; }

  # Only runs for PRs targeting main — dev -> main is where releases are cut,
  # so this is the heavier gate: full build, on both OSes, with output
  # sanity checks. Feature -> dev and plain dev pushes only need `check`.
  release-gate:
    name: Release gate (build)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: check
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify dist outputs
        shell: bash
        run: |
          test -f dist/app.html
          test -f dist/pwa/index.html
          test -f dist/pwa/sw.js
          test -f dist/pwa/manifest.json
