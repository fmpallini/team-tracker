name: CI

on:
  push:
    branches:
      - dev
  # Into dev: Dependabot's bump PRs (dependabot.yml sets target-branch: dev) —
  # that's the only thing that opens a PR against dev, since all human work
  # commits to dev directly (CLAUDE.md: no feature branches). Into main: the
  # release PR, which picks up the heavier gates below.
  pull_request:
    branches:
      - dev
      - main

# Pushing twice in quick succession used to leave both runs going, each paying
# for a full build + Chromium. Supersede the in-flight run for a PR — a new
# commit makes the old verdict irrelevant — but never for a push to dev, so
# every commit that actually lands keeps its own recorded result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deny by default; each job opts into exactly what it needs. A job added later
# without its own `permissions:` block fails closed instead of inheriting
# whatever the repo default happens to be.
permissions: {}

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # e2e used to run only in the pre-push hook, on your machine, on every push
  # — the slowest gate there (full build + Chromium). Moved here so pushes are
  # fast and e2e enforcement no longer depends on the hook being installed or
  # not bypassed with --no-verify. Runs on every push to dev (catch early) and
  # on PRs into main (release gate); skipped for PRs into dev, i.e. Dependabot
  # bumps — those still get `check`, and the e2e run on the dev push that
  # merges them.
  #
  # Three jobs make that up: `e2e-plan` decides whether the suite has to run,
  # `e2e-shard` runs it in two halves in parallel, and `e2e` (the name the rest
  # of the repo knows) folds the halves into one verdict.

  # A release PR (dev -> main) is the same commit the dev push already tested.
  # Re-running e2e there proves nothing new when (a) that exact SHA already has
  # a green `E2E (Playwright)` and (b) main is an ancestor of it, so merging
  # changes no file and the merge ref's tree equals the tested tree. If either
  # fails (main gained a commit dev lacks, or the dev run is red or still
  # going), the suite runs in full as before.
  e2e-plan:
    name: E2E plan
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$EVENT" = pull_request ]; then
            behind=$(gh api "repos/$REPO/compare/$BASE...$SHA" --jq .behind_by)
            green=$(gh api -X GET "repos/$REPO/commits/$SHA/check-runs" -f check_name='E2E (Playwright)' -f per_page=100               --jq '[.check_runs[] | select(.conclusion == "success")] | length')
            echo "main is $behind commit(s) ahead of the PR head; green E2E runs on $SHA: $green"
            if [ "$behind" = 0 ] && [ "$green" -gt 0 ]; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "E2E skip: $skip"

  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/2
    needs: e2e-plan
    if: needs.e2e-plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One red half must not hide the other half's result (or its trace artifact).
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The Chromium build is ~150MB and only changes when @playwright/test
      # does, so key the cache on that package's version — not on the whole
      # lockfile, which every app version bump edits (that missed the cache on
      # every release and stored a fresh 268MB copy each time). The OS-level
      # libraries `--with-deps` installs live outside ~/.cache/ms-playwright
      # and are not cached, hence the separate install-deps on a hit.
      - id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Two halves of the same suite (fullyParallel, so tests, not files, are
      # split): same coverage, about half the wall time. Each half keeps the
      # runner's own 2 workers — more workers per runner would only make the
      # timing-sensitive specs (search/nav cost, large paste) noisier.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2

      # playwright.config.ts records a trace on first retry; without this the
      # trace is written into the runner and thrown away, leaving a CI-only
      # failure with nothing to open locally.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-results-${{ github.run_id }}-shard${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The one E2E verdict. Keeps the name the earlier single job had, which is
  # also what `e2e-plan` looks up on a release PR's head SHA.
  e2e:
    name: E2E (Playwright)
    needs: [e2e-plan, e2e-shard]
    if: always() && (github.event_name == 'push' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          PLAN: ${{ needs.e2e-plan.result }}
          SKIP: ${{ needs.e2e-plan.outputs.skip }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "plan=$PLAN skip=$SKIP shards=$SHARDS"
          [ "$PLAN" = success ] || { echo "::error::E2E plan did not succeed"; exit 1; }
          if [ "$SKIP" = true ]; then
            echo "Skipped: this exact commit already passed E2E and main adds nothing to it."
            exit 0
          fi
          [ "$SHARDS" = success ] || { echo "::error::an E2E shard did not succeed"; exit 1; }

  # Only runs for PRs targeting main — dev -> main is where releases are cut,
  # so this is the heavier gate: full build, on both OSes, with output
  # sanity checks. Feature -> dev and plain dev pushes only need `check`.
  release-gate:
    name: Release gate (build)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: check
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify dist outputs
        shell: bash
        run: |
          test -f dist/app.html
          test -f dist/pwa/index.html
          test -f dist/pwa/sw.js
          test -f dist/pwa/manifest.json

  # Also main-only: a dev -> main PR that bumps package.json's version MUST
  # carry a matching, non-empty "## [x.y.z]" section in CHANGELOG.md. Without
  # it, release.yml silently falls back to auto-generated PR-title notes
  # (`--generate-notes`), so a forgotten entry degrades the release instead of
  # blocking it — this gate is what turns that into a hard failure at PR time,
  # while the version bump is still easy to pair with its changelog entry.
  changelog-gate:
    name: Changelog entry for version bump
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Default shallow checkout, not fetch-depth: 0 — this job reads exactly
      # one file from the base branch, and a full clone of this repo is ~135MB
      # of history to fetch for it. The one commit it needs is pulled below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require CHANGELOG.md entry when package.json version changes
        shell: bash
        run: |
          set -euo pipefail
          ver() { grep -m1 '"version"' "$1" | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/'; }
          HEAD_VER=$(ver package.json)
          # The shallow PR checkout has no origin/<base> tracking ref, so fetch
          # just that branch's tip (depth 1, unauthenticated — public repo).
          git fetch --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          git show "origin/${GITHUB_BASE_REF}:package.json" > /tmp/base-package.json
          BASE_VER=$(ver /tmp/base-package.json)
          echo "package.json version: base=${BASE_VER} head=${HEAD_VER}"
          if [ "$HEAD_VER" = "$BASE_VER" ]; then
            echo "No version change — CHANGELOG.md entry not required."
            exit 0
          fi
          if ! grep -qF "## [${HEAD_VER}]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::package.json version bumped ${BASE_VER} -> ${HEAD_VER} but CHANGELOG.md has no '## [${HEAD_VER}]' section. Add one covering every user-facing change since the last release tag."
            exit 1
          fi
          BODY=$(awk -v t="## [${HEAD_VER}]" '
            index($0, t) == 1 { f = 1; next }
            f && index($0, "## [") == 1 { exit }
            f && NF { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md '## [${HEAD_VER}]' section is empty — release.yml would fall back to auto-generated notes."
            exit 1
          fi
          echo "CHANGELOG.md '## [${HEAD_VER}]' section present and non-empty."
